apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-tasks
  namespace: devops-tasks
  labels:
    app.kubernetes.io/name: devops-tasks
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: devops-tasks
  template:
    metadata:
      labels:
        app.kubernetes.io/name: devops-tasks
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: devops-tasks:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: temporary-files
              mountPath: /tmp
          env:
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://postgres:5432/tasks
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: devops-tasks-db
                  key: username
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: devops-tasks-db
                  key: password
            - name: JAVA_TOOL_OPTIONS
              value: -XX:MaxRAMPercentage=75.0
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: temporary-files
          emptyDir:
            sizeLimit: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: devops-tasks
  namespace: devops-tasks
  labels:
    app.kubernetes.io/name: devops-tasks
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: devops-tasks
  ports:
    - name: http
      port: 80
      targetPort: http
